<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominate - Peer-to-Peer Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="relative min-h-screen bg-gradient-to-tr from-purple-500 via-pink-500 to-red-500 flex justify-center items-start py-8 px-4 font-sans overflow-hidden">

  <!-- Decorative floating circles -->
  <div class="absolute top-0 left-0 w-72 h-72 bg-purple-300/40 rounded-full blur-3xl animate-pulse-slow"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-pink-300/30 rounded-full blur-3xl animate-pulse-slow"></div>
  <div class="absolute top-1/2 left-1/4 w-60 h-60 bg-yellow-200/20 rounded-full blur-2xl animate-pulse-slow"></div>

  <!-- Container -->
  <div class="relative z-10 w-full max-w-6xl flex flex-col lg:flex-row gap-6">

    <!-- Quiz / Ask Section -->
    <div class="flex-1 bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-2xl border border-white/30">
      <h1 class="text-4xl font-extrabold text-center mb-6 text-gradient bg-clip-text text-transparent bg-gradient-to-r from-purple-600 via-pink-600 to-red-500 tracking-wide drop-shadow-lg">Dominate</h1>

      <!-- ASK QUESTION -->
      <div id="askSection" class="mt-4 space-y-3 hidden">
        <input type="text" id="userQuestion" placeholder="Ask a question" 
               class="w-full p-4 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-400 transition shadow-sm"/>
        <button id="askBtn" 
                class="w-full bg-purple-600 text-white p-4 rounded-2xl font-semibold hover:bg-purple-700 active:scale-95 shadow-lg transition">Ask Question</button>
      </div>

      <!-- QUIZ SECTION -->
      <div id="quizSection" class="hidden mt-4 space-y-3">
        <h2 class="text-2xl font-bold text-center text-gray-800 p-4 bg-gradient-to-r from-purple-100 to-pink-100 rounded-2xl shadow-inner" id="currentQuestion">Waiting for question...</h2>
        <p id="fastestUserDisplay" class="text-center text-gray-700 font-medium text-lg mt-2"></p>
        <button id="answerBtn" 
                class="bg-yellow-400 text-white p-4 rounded-2xl w-full font-semibold hover:bg-yellow-500 active:scale-95 shadow-lg transition">I want to answer</button>

        <!-- FASTEST CLICKER INPUT -->
        <div id="answerInputSection" class="hidden space-y-3 mt-3">
          <input type="text" id="userAnswer" placeholder="Type your answer" 
                 class="w-full p-4 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-400 shadow-sm transition"/>
          <button id="submitAnswerBtn" 
                  class="bg-green-500 text-white p-4 rounded-2xl w-full font-semibold hover:bg-green-600 active:scale-95 shadow-lg transition">Submit Answer</button>
        </div>
      </div>

      <!-- JUDGING SECTION -->
      <div id="judgeSection" class="hidden mt-4 space-y-3 p-6 border border-gray-300 rounded-2xl bg-gray-50 shadow-inner">
        <h3 class="text-lg font-semibold text-gray-700">Decide if the answer is correct:</h3>
        <p id="answerToJudge" class="mb-3 font-semibold text-gray-800 p-3 bg-gray-100 rounded-xl"></p>
        <div class="flex flex-col sm:flex-row gap-3">
          <button id="markRight" class="bg-green-500 text-white p-3 rounded-2xl flex-1 font-semibold hover:bg-green-600 active:scale-95 shadow-md transition">Right</button>
          <button id="markWrong" class="bg-red-500 text-white p-3 rounded-2xl flex-1 font-semibold hover:bg-red-600 active:scale-95 shadow-md transition">Wrong</button>
        </div>
      </div>
    </div>

    <!-- Scoreboard Section -->
    <div class="w-full lg:w-1/3 bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-white/30 flex flex-col">
      <h3 class="text-xl font-semibold text-purple-700 mb-4 text-center">Scoreboard</h3>
      <ul id="scoreboardList" class="list-disc pl-5 text-gray-700 space-y-2 overflow-y-auto max-h-[500px]"></ul>
    </div>

  </div>

  <style>
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 0.3; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 8s ease-in-out infinite;
    }
  </style>


<script>
// ------------------ FIREBASE CONFIG ------------------
const firebaseConfig = {
  apiKey: "AIzaSyC62iBhaSeZsveTYwyGeR01LcEb-TzqlVI",
  authDomain: "earnburn-8abfb.firebaseapp.com",
  projectId: "earnburn-8abfb",
  storageBucket: "earnburn-8abfb.firebasestorage.app",
  messagingSenderId: "831063318223",
  appId: "1:831063318223:web:be3aab9253cef04eb0e1ba",
  measurementId: "G-C77DF9QBJZ"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentQuestionDoc = null;
let fastestUser = null;

// ------------------ LOGIN CHECK ------------------
auth.onAuthStateChanged(async (user)=>{
  if(!user){
    window.location.href = "login.html";
    return;
  }
  currentUser = user;

  const userRef = db.collection("users").doc(currentUser.uid);
  const doc = await userRef.get();
  if(!doc.exists){
    await userRef.set({ email: currentUser.email, score: 0 });
  }

  document.getElementById("askSection").classList.remove("hidden");

  startQuestionListener();
  displayScores();
});

// ------------------ ASK QUESTION ------------------
document.getElementById("askBtn").addEventListener("click", async ()=>{
  const questionText = document.getElementById("userQuestion").value.trim();
  if(!questionText){ alert("Enter a question"); return; }

  await db.collection("questions").add({
    question: questionText,
    askedBy: currentUser.uid,
    answeredBy: null,
    answerText: "",
    fastestClickedBy: null,
    status: "pending",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById("userQuestion").value = "";
  document.getElementById("askSection").classList.add("hidden");
});

// ------------------ LISTEN FOR QUESTIONS ------------------
function startQuestionListener(){
  db.collection("questions").orderBy("createdAt").limit(1).onSnapshot(snapshot=>{
    if(snapshot.empty){
      document.getElementById("askSection").classList.remove("hidden");
      document.getElementById("quizSection").classList.add("hidden");
      document.getElementById("fastestUserDisplay").innerText = "";
      return;
    }

    snapshot.forEach(async doc=>{
      currentQuestionDoc = doc;
      const data = doc.data();

      document.getElementById("currentQuestion").innerText = data.question;
      document.getElementById("quizSection").classList.remove("hidden");
      document.getElementById("askSection").classList.add("hidden");

      fastestUser = data.fastestClickedBy || null;

      if(data.status === "answered" && data.askedBy === currentUser.uid){
        document.getElementById("answerToJudge").innerText = data.answerText;
        document.getElementById("judgeSection").classList.remove("hidden");
      } else {
        document.getElementById("judgeSection").classList.add("hidden");
      }

      const answerBtn = document.getElementById("answerBtn");
      if(currentUser.uid === data.askedBy || fastestUser){
        answerBtn.style.display = "none";
      } else {
        answerBtn.style.display = "block";
      }

      if(fastestUser){
        const userSnap = await db.collection("users").doc(fastestUser).get();
        const email = userSnap.exists ? userSnap.data().email : "Someone";
        document.getElementById("fastestUserDisplay").innerText = `Answering: ${email}`;
      } else {
        document.getElementById("fastestUserDisplay").innerText = "";
      }

      if(fastestUser !== currentUser.uid){
        document.getElementById("answerInputSection").classList.add("hidden");
      }
    });
  });
}

// ------------------ FASTEST CLICKER ------------------
document.getElementById("answerBtn").addEventListener("click", async ()=>{
  if(currentQuestionDoc.data().askedBy === currentUser.uid){
    alert("You cannot answer your own question!");
    return;
  }
  if(currentQuestionDoc.data().fastestClickedBy){
    alert("Someone already clicked!");
    return;
  }

  fastestUser = currentUser.uid;

  await db.collection("questions").doc(currentQuestionDoc.id).update({
    fastestClickedBy: fastestUser
  });

  document.getElementById("answerInputSection").classList.remove("hidden");
  document.getElementById("fastestUserDisplay").innerText = `Answering: ${currentUser.email}`;
  document.getElementById("answerBtn").style.display = "none";
});

// ------------------ SUBMIT ANSWER ------------------
document.getElementById("submitAnswerBtn").addEventListener("click", async ()=>{
  const answerText = document.getElementById("userAnswer").value.trim();
  if(!answerText){ alert("Enter your answer"); return; }

  await db.collection("questions").doc(currentQuestionDoc.id).update({
    answeredBy: currentUser.uid,
    answerText,
    status: "answered"
  });

  document.getElementById("answerInputSection").classList.add("hidden");
});

// ------------------ JUDGING ------------------
document.getElementById("markRight").addEventListener("click", async ()=>{
  const questionData = currentQuestionDoc.data();
  if(questionData.answeredBy){
    await db.collection("users").doc(questionData.answeredBy).update({
      score: firebase.firestore.FieldValue.increment(10)
    });
  }
  await db.collection("questions").doc(currentQuestionDoc.id).delete();
  resetAfterJudging();
});

document.getElementById("markWrong").addEventListener("click", async ()=>{
  const questionData = currentQuestionDoc.data();
  if(questionData.answeredBy){
    await db.collection("users").doc(questionData.answeredBy).update({
      score: firebase.firestore.FieldValue.increment(-10)
    });
  }
  await db.collection("questions").doc(currentQuestionDoc.id).delete();
  resetAfterJudging();
});

function resetAfterJudging(){
  document.getElementById("judgeSection").classList.add("hidden");
  document.getElementById("askSection").classList.remove("hidden");
  document.getElementById("fastestUserDisplay").innerText = "";
  document.getElementById("quizSection").classList.add("hidden");
}

// ------------------ SCOREBOARD ------------------
async function displayScores(){
  const usersSnap = await db.collection("users").get();
  const list = document.getElementById("scoreboardList");
  list.innerHTML = "";
  usersSnap.forEach(doc=>{
    const li = document.createElement("li");
    li.innerText = `${doc.data().email} : ${doc.data().score || 0}`;
    list.appendChild(li);
  });
}

setInterval(displayScores, 5000);
</script>

</body>
</html>
